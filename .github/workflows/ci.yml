# The repo's own verification. A tool that checks whether your build is really
# green has no business not checking its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · test · lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build every package and the demo
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # The demo end-to-end suite boots a real Next server twice; skip it here
      # and run it in the job below, so a failure says which kind it was.
      - name: Unit and integration tests
        run: pnpm test
        env:
          GROUNDTRACE_SKIP_E2E: "1"

  e2e:
    name: demo end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # A real browser is what lets `verify` prove a displayed number matches
      # its source rather than checking only the server side. Playwright is
      # never a dependency of the CLI (see packages/cli/src/browser.ts), so the
      # browser is installed through the `playwright-core` dev dependency —
      # there is no `playwright` binary here to call.
      - name: Install Chromium
        run: pnpm --filter groundtrace exec playwright-core install --with-deps chromium

      # GROUNDTRACE_REQUIRE_BROWSER turns the suite's "no browser here" branch
      # into a failure. This job installs one on purpose; if the scan silently
      # fell back to the server-side basis, the job would be green while
      # testing nothing it was created to test.
      - name: Boot the demo and verify both toggle states
        run: pnpm --filter groundtrace exec vitest run src/verify-demo.test.ts
        env:
          GROUNDTRACE_REQUIRE_BROWSER: "1"

      # The step above calls runVerify() directly. This one goes through the
      # binary that actually ships, which is the only check that `bin.js`,
      # argument parsing and the JSON output still work together.
      - name: Verify the demo through the shipped binary
        env:
          SIMULATE_API_FAILURE: "false"
          REPORT: ${{ runner.temp }}/verify.json
        run: |
          node packages/cli/dist/bin.js verify \
            --cwd examples/dashboard-demo --skip-build --skip-tests --json \
            | tee "$REPORT"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(process.env.REPORT, "utf8"));
            const fail = (message) => {
              console.error(`::error::${message}`);
              process.exit(1);
            };
            if (result.basis !== "dom") fail(`expected a real-DOM scan, got basis=${result.basis}`);
            if (result.confidence !== 1) fail(`expected 100% confidence, got ${result.confidence}`);
            if (!result.ok) fail("verify reported the healthy demo as not ok");
          '
