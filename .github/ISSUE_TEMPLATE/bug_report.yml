name: Bug report
description: Something behaves differently from what it claims
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A misclassification — a value reported VERIFIED that isn't,
        or FALLBACK that is fine — is the most valuable kind of bug here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did GroundTrace report, and what should it have reported?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: The report, if you have one
      description: Output of `groundtrace verify --json`, or the overlay's reason line.
      render: json

  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Node version, framework, OS
      placeholder: "Node 22.14, Next 16.3, macOS 15"
    validations:
      required: true
